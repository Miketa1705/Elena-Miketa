knade?\",\"pricing_faq_are_there_any_hidden_fees_answer\":\"Nema skrivenih naknada. Naše cijene su transparentne s jasnim pretplatničkim cijenama koje počinju od 24,99 USD mjesečno ili 49,99 USD tromjesečno.\",\"pricing_faq_is_my_data_secure\":\"Jesu li moji podaci sigurni?\",\"pricing_faq_is_my_data_secure_answer\":\"Da, sigurnost podataka i privatnost nam su prioritet. Vaši razgovori i osobni podaci zaštićeni su standardnim šifriranjem i sigurnosnim mjerama u industriji. Ne dijelimo vaše podatke s trećim stranama bez vašeg pristanka.\",\"pricing_faq_title\":\"Često postavljana pitanja\",\"footer_terms_and_conditions\":\"Uvjeti i odredbe\"},\"Footer\":{\"footer_customer_support\":\"Korisnička podrška\",\"footer_cancel_subscription\":\"Otkaži pretplatu\",\"footer_privacy_policy\":\"Pravila o privatnosti\",\"footer_terms_and_conditions\":\"Uvjeti i odredbe\",\"footer_cookie_policy\":\"Pravila o kolačićima\",\"footer_refund_policy\":\"Pravila povrata novca\",\"footer_help_center\":\"Centar za pomoć\",\"footer_pricing\":\"Cijene\",\"footer_copyright\":\"© {currentYear} {companyName} Sva prava pridržana. Svi ovdje navedeni zaštitni znakovi vlasništvo su njihovih vlasnika. Nismo povezani ni s jednim vlasnikom ili tvrtkom koja je razvila LLM modele navedene na ovoj web stranici.\",\"footer_legal\":\"Pravni\"},\"SelectLanguage\":{\"label_select_language\":\"Odaberite jezik\"},\"SubscriptionCancel\":{\"subscription_cancel_title\":\"Otkažite pretplatu\",\"subscription_cancel_description\":\"Jeste li sigurni da želite otkazati? Izgubit ćete pristup svim premium značajkama nakon što vaša pretplata završi.\",\"subscription_cancel_no_subscription_title\":\"Nema aktivnih pretplata\",\"subscription_cancel_no_subscription_description\":\"Nemate aktivnu pretplatu za otkazivanje.\",\"subscription_cancel_confirm_title\":\"Trenutno koristite naš plan {planName}\",\"subscription_cancel_confirm_description\":\"Jeste li sigurni da želite otkazati pretplatu? Izgubit ćete pristup svim premi ls_get_error\":\"Nije uspjelo dohvaćanje modela\",\"model_card_description_claude_opus_4_1\":\"Napredni model zaključivanja koji pruža promišljene, dobro promišljene odgovore za složena pitanja i zadatke koji zahtijevaju pažljivu analizu.\",\"model_card_description_claude_opus_4_5\":\"Claude Opus 4.5 je najsposobniji i najinteligentniji Anthropicov model, izvrstan u složenom zaključivanju, nijansiranom pisanju i sofisticiranim analitičkim zadacima.\",\"model_card_description_deepseek_r1\":\"DeepSeek Reasoner je specijalizirani model koji je razvio DeepSeek, a koristi zaključivanje lanca misli (CoT) za poboljšanje točnosti odgovora. Prije pružanja konačnog odgovora, generira detaljne korake zaključivanja koji su dostupni putem API-ja, omogućujući korisnicima da ispitaju i iskoriste misaoni proces modela, a opslužuje ga Fireworks AI.\",\"model_card_description_gemini_2_5_flash\":\"Gemini 2.5 Flash je svestrani AI model koji uravnotežuje performanse i brzinu, izvrsno se pokazujući u širokom rasponu zadataka, od generiranja teksta do multimodalnog razumijevanja.\",\"model_card_description_qwen_3_max\":\"Qwen 3 Max je dizajniran za složene, dugotrajne zadatke koji zahtijevaju kontinuiranu pažnju i detaljnu analizu, savršen za sveobuhvatno istraživanje i prošireno razmišljanje.\",\"gateway_llama_3_3_70b_versatile\":\"Llama je model otvorenog koda sa 70 milijardi parametara koji je izradila Meta, fino podešen za potrebe praćenja instrukcija. Poslužuje ga Groq sa svojim prilagođenim hardverom za jezične procesorske jedinice (LPU) kako bi se osiguralo brzo i učinkovito zaključivanje.\",\"model_card_description_deepinfra_kimi_k2\":\"DeepInfra Kimi K2 je specijalizirani model optimiziran za rješavanje izazovnih, složenih pitanja koja zahtijevaju duboko razmišljanje i sveobuhvatnu analizu.\",\"model_card_description_gpt_4o_mini\":\"GPT-4o Mini je pojednostavljena verzija GPT-4o koja pruža brze i učinkovite odgovore uz održavanje visoke kvalitete za svakodnevne zadatke i razgovore.\",\"model_card_description_gpt_5\":\"GPT-5 je vodeći jezični model OpenAI-a koji se ističe u složenom zaključivanju, širokom znanju iz stvarnog svijeta, kodno intenzivnom i višekoračnom agentskom zadatku.\",\"model_card_description_grok_4\":\"xAI-jev najnoviji i najbolji vodeći model, koji nudi neusporedive performanse u prirodnom jeziku, matematici i logičkom zaključivanju - savršen majstor za sve.\",\"model_card_description_gpt_4o\":\"GPT-4o kombinira pouzdanost s jakim sposobnostima rasuđivanja, pružajući dosljedne performanse u širokom rasponu zadataka s učinkovitom obradom.\",\"model_card_selected\":\"Odabrano\",\"model_claude_opus_4_1_subtitle\":\"Najbolje za promišljene i pažljive odgovore\",\"model_claude_opus_4_5_subtitle\":\"Najsposobniji Claude model\",\"model_deepseek_r1_subtitle\":\"Jasno objašnjava svoje korake\",\"model_gemini_2_5_flash_subtitle\":\"Najbolji svestrani alat\",\"model_card_description_gemini_3_pro\":\"Gemini 3 Pro je najnovija generacija modela, koja nudi neusporedivu izvedbu u prirodnom jeziku, matematici i zaključivanju.\",\"model_gemini_3_pro_subtitle\":\"Vodeći model\",\"model_qwen_3_max_subtitle\":\"Obavlja dug, detaljan rad\",\"model_llama_3_3_70b_versatile_subtitle\":\"Svestran za svakodnevne zadatke\",\"model_deepinfra_kimi_k2_subtitle\":\"Odlično za teška pitanja\",\"model_gpt_4o_mini_subtitle\":\"Brz i responzivan\",\"model_gpt_5_subtitle\":\"Inteligentni model za razgovor\",\"model_gpt_4o_subtitle\":\"Pouzdano, snažno obrazloženje\",\"model_grok_4_subtitle\":\"Brzo, oštro i korisno\",\"model_gpt_5_1_subtitle\":\"Napredno obrazloženje\",\"model_card_description_gpt_5_1\":\"Poboljšani model obrazloženja s optimiziranom izvedbom za složene zadatke\",\"model_gpt_5_2_subtitle\":\"Vodeći model\",\"model_card_description_gpt_5_2\":\"Najnoviji vodeći model OpenAI s najnaprednijim mogućnostima\"},\"Limits\":{\"toast_description_user_context_blocked\":\"Nije moguće učitati korisnički kontekst\",\"guest_limit_message\":\"Za nastavak
